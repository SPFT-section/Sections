<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>SECTiON</title>
  <!--
    GitHub Pages SPA redirect trick (https://github.com/rafgraph/spa-github-pages).
    GitHub Pages serves this file for any unknown path (e.g. /stq-app/library).
    It re-encodes the path into a query string and redirects to index.html,
    where a matching script in index.html restores the real URL via
    history.replaceState before React Router takes over.
  -->
  <script>
    var segmentsToKeep = 1; // number of path segments to keep as the app base (repo name)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
